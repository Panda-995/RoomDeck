<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoomDeck · 新功能预览</title><style>body{margin:0;background:#f7f8f5;color:#263b33;font:16px/1.6 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:48px 24px}h1{font-size:36px;margin:0}p{color:#5d6b64}nav{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0}button{padding:12px 18px;border:1px solid #dce4da;border-radius:10px;background:white;color:inherit;cursor:pointer;font:inherit}button[aria-pressed=true]{background:#30664d;color:white}img{display:block;max-width:100%;height:auto;margin:auto;border:1px solid #dde4dc;border-radius:12px}a{color:#30664d}figure{margin:0}figcaption{margin:16px 0;color:#5d6b64}.mobile{max-width:390px}</style><main><p>ROOMDECK / SEPTEMBER 2026</p><h1>让现场互动更顺畅</h1><p>实际运行截图 · 断线恢复、上传续传、投屏排队、表情弹幕与指定投票上屏</p><nav aria-label="界面选择"><button data-image="host" aria-pressed="true">主持人</button><button data-image="mobile" aria-pressed="false">手机互动</button><button data-image="queue-mobile" aria-pressed="false">投屏排队</button><button data-image="display" aria-pressed="false">大屏投票</button><button data-image="upload" aria-pressed="false">上传续传</button></nav><figure><img id="screen" src="screenshots/features/features-host.png" alt="主持人界面"><figcaption id="caption">主持人选择上屏投票，并管理弹幕与表情反应。</figcaption></figure><p><a href="FEATURES-2026-09.md">功能说明与当前边界</a> · <a href="http://127.0.0.1:8080/">打开本地应用</a></p></main><script>const captions={host:'主持人选择上屏投票，并管理弹幕与表情反应。',mobile:'手机端的互动区域和内容表情，沿用原来的底部导航。','queue-mobile':'审核通过后提示轮到你了，点击按钮再选择分享的屏幕。',display:'题目、选项、二维码与独立消息区域；结果未公开时不显示票数。',upload:'刷新后重新选择原文件，补传缺失分片，完成后仍显示在任务列表中。'};document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));const key=button.dataset.image;const image=document.getElementById('screen');image.src='screenshots/features/features-'+key+'.png';image.alt=button.textContent;image.className=key.includes('mobile')?'mobile':'';document.getElementById('caption').textContent=captions[key];}));</script></html>
