# NAS 局域网部署：只需修改下方 ROOMDECK_MEDIA_IP。
# NAS LAN deployment: set ROOMDECK_MEDIA_IP to your NAS address.
services:
  roomdeck:
    image: ghcr.io/panda-995/roomdeck:latest
    ports:
      - "8080:8080"
    volumes:
      - roomdeck-data:/data
      - roomdeck-media-config:/media-config:ro
    environment:
      TZ: Asia/Shanghai
      LIVEKIT_INTERNAL_URL: http://livekit:7880
    entrypoint: ["/bin/sh", "-ec", "set -a; . /media-config/roomdeck.env; set +a; exec /app/roomdeck"]
    depends_on:
      media-init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  media-init:
    image: ghcr.io/panda-995/roomdeck:latest
    user: "0:0"
    entrypoint: ["/bin/sh", "/app/init-media.sh"]
    environment:
      ROOMDECK_MEDIA_IP: "192.168.1.100" # 改成 NAS 的实际局域网 IP / Your NAS LAN IP
    volumes:
      - roomdeck-media-config:/config
    healthcheck:
      disable: true
    restart: "no"

  livekit:
    image: livekit/livekit-server:v1.13.6
    command: ["--config", "/config/livekit.yaml"]
    depends_on:
      media-init:
        condition: service_completed_successfully
    volumes:
      - roomdeck-media-config:/config:ro
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
      - "3478:3478/udp"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  roomdeck-data:
  roomdeck-media-config:
